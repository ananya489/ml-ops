# Github actions workflow
# Github automatically looks for workflow file inside .github/workflows/ci.yaml

# give workflow a meaningful name
name: Iris ML API - CI Pipeline
 
#  define when github should run this workflow 
on:
  # run CI whenever code is pushed to the main branch
  push:
    branches:
      - main
  # Also validate proposed changes before they are merged
  pull_request:
    branches:
      - main

# Permissions are restricted to reading repo content only
permissions:
  contents: read

# Define the joobs that make up the pipeline
jobs:
  test-and-build:
    # Github provides a fresh ubuntu VM for this jo
    runs-on: ubuntu-latest
    # steps
    steps:
      # Step-1: Download the repo content to the runner
      - name: Check out repository
        uses: actions/checkout@v4

      # step-2:Install python on runner
      - name: Install Python on runner
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      # step 3- Install the dependencies needed to run the tests
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirement.txt

      # Step 4-Execute the automated tests
      - name: Run automated tests
        run: python -m pytest -v

      # Step 5-   Build image only after tests have passes
      - name: Build Docker image
        run: docker build -t iris-ml-api:${{ github.sha }} .